# XcodeGen spec — the .xcodeproj is generated (and git-ignored), so the
# project never drifts and can be rebuilt on any macOS runner:
#   brew install xcodegen && xcodegen generate
name: BrainboxAgent
options:
  bundleIdPrefix: app.brainbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  BrainboxCore:
    path: Packages/BrainboxCore

targets:
  BrainboxAgent:
    type: application
    platform: iOS
    sources:
      - path: BrainboxAgent
    dependencies:
      - package: BrainboxCore
    info:
      path: BrainboxAgent/Info.plist
      properties:
        CFBundleDisplayName: Brainbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Brainbox Agent uses Face ID to confirm sensitive actions like opening the terminal, editing configuration and controlling services.
        NSLocalNetworkUsageDescription: Brainbox Agent connects to your private Brainbox gateway on your local or Tailscale network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.brainbox.agent
        PRODUCT_NAME: BrainboxAgent
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

  BrainboxAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrainboxAgentTests
    dependencies:
      # BrainboxCore is linked into the app; the hosted test bundle resolves
      # its symbols through BUNDLE_LOADER, so it is not linked a second time.
      - target: BrainboxAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.brainbox.agent.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BrainboxAgent.app/BrainboxAgent
        BUNDLE_LOADER: $(TEST_HOST)

  BrainboxAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrainboxAgentUITests
    dependencies:
      - target: BrainboxAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.brainbox.agent.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BrainboxAgent

schemes:
  BrainboxAgent:
    build:
      targets:
        BrainboxAgent: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - BrainboxAgent
      targets:
        - name: BrainboxAgentTests
          parallelizable: false
        - name: BrainboxAgentUITests
          parallelizable: false
    archive:
      config: Release
