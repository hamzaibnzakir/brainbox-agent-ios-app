# XcodeGen spec — the .xcodeproj is generated (and git-ignored), so the
# project never drifts and can be rebuilt on any macOS runner:
#   brew install xcodegen && xcodegen generate
name: BrainboxAgent
options:
  bundleIdPrefix: app.brainbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  BrainboxCore:
    path: Packages/BrainboxCore
  # SSH straight to Hermes (SwiftNIO SSH) + Hermes' gateway protocol.
  HermesKit:
    path: Packages/HermesKit
  # Terminal emulator for the direct VPS terminal (MIT, Miguel de Icaza).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    minorVersion: 1.2.0

targets:
  BrainboxAgent:
    type: application
    platform: iOS
    sources:
      - path: BrainboxAgent
      - path: Shared
    dependencies:
      - package: BrainboxCore
      - package: HermesKit
      - package: SwiftTerm
      - target: BrainboxWidgets
    info:
      path: BrainboxAgent/Info.plist
      properties:
        CFBundleDisplayName: Brainbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Hold the mic to talk to Hermes. Your recording is sent to your own server to be transcribed.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.content
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Brainbox uses Face ID to unlock your SSH key and to confirm sensitive actions like the terminal, config edits and gateway restarts.
        NSLocalNetworkUsageDescription: Brainbox connects over SSH to your server, which may be on your local or Tailscale network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: Brainbox Agent lets you pick photos to send to your agent or upload to your server's Brainbox workspace.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.brainbox.agent.refresh
        CFBundleURLTypes:
          - CFBundleURLName: app.brainbox.agent
            CFBundleURLSchemes:
              - brainbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.brainbox.agent
        PRODUCT_NAME: BrainboxAgent
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO

  BrainboxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BrainboxWidgets
      - path: Shared
    info:
      path: BrainboxWidgets/Info.plist
      properties:
        CFBundleDisplayName: Brainbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.brainbox.agent.widgets
        PRODUCT_NAME: BrainboxWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  BrainboxAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrainboxAgentTests
    dependencies:
      # BrainboxCore is linked into the app; the hosted test bundle resolves
      # its symbols through BUNDLE_LOADER, so it is not linked a second time.
      - target: BrainboxAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.brainbox.agent.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BrainboxAgent.app/BrainboxAgent
        BUNDLE_LOADER: $(TEST_HOST)

  BrainboxAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BrainboxAgentUITests
    dependencies:
      - target: BrainboxAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.brainbox.agent.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BrainboxAgent

schemes:
  BrainboxAgent:
    build:
      targets:
        BrainboxAgent: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - BrainboxAgent
      targets:
        - name: BrainboxAgentTests
          parallelizable: false
        - name: BrainboxAgentUITests
          parallelizable: false
    archive:
      config: Release
