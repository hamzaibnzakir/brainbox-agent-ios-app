name: Signed IPA

# Optional. Produces a signed .ipa using YOUR Apple signing identity stored in
# GitHub encrypted secrets. Nothing secret is ever committed to the repo.
# Follows GitHub's documented approach for installing an Apple certificate on
# macOS runners (temporary keychain, deleted at the end of the job).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   BUILD_CERTIFICATE_BASE64      base64 of your .p12 (Apple Development or Distribution cert + private key)
#   P12_PASSWORD                  password used when exporting the .p12
#   BUILD_PROVISION_PROFILE_BASE64 base64 of the matching .mobileprovision
#   KEYCHAIN_PASSWORD             any random string (used for the temporary keychain)
#   APPLE_TEAM_ID                 your 10-character Team ID
# Optional repository variable:
#   BUNDLE_ID                     defaults to app.brainbox.agent (must match the profile)
#
# See docs/BUILD_AND_SIDELOAD.md for how to create these without a Mac.

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method (must match your provisioning profile type)"
        required: true
        default: development
        type: choice
        options: [development, ad-hoc, release-testing, app-store-connect]

permissions:
  contents: read

jobs:
  signed:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'app.brainbox.agent' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are configured
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12: ${{ secrets.P12_PASSWORD }}
          KC: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$CERT" ] && missing="$missing BUILD_CERTIFICATE_BASE64"
          [ -z "$PROFILE" ] && missing="$missing BUILD_PROVISION_PROFILE_BASE64"
          [ -z "$P12" ] && missing="$missing P12_PASSWORD"
          [ -z "$KC" ] && missing="$missing KEYCHAIN_PASSWORD"
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Add these repository secrets:$missing (see docs/BUILD_AND_SIDELOAD.md). The unsigned IPA from the CI workflow works with Sideloadly/SideStore without them."
            exit 1
          fi

      - name: Install certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $NAME"
          rm -f "$CERT_PATH" "$PP_PATH"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (signed)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          STATUS=0
          xcodebuild archive \
            -project BrainboxAgent.xcodeproj \
            -scheme BrainboxAgent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BrainboxAgent.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            > build/archive.log 2>&1 || STATUS=$?
          tail -n 40 build/archive.log
          bash scripts/ci/annotate-log.sh build/archive.log "Signed archive"
          exit $STATUS

      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          METHOD: ${{ inputs.export_method }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/BrainboxAgent.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export
          ls -la build/export

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: BrainboxAgent-signed-${{ inputs.export_method }}
          path: build/export/*.ipa
          retention-days: 14

      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
