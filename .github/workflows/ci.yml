name: CI

# Builds and tests everything on GitHub-hosted runners so no local Mac is
# needed. Produces an UNSIGNED .ipa artifact on every push to main that can
# be signed and installed with a sideloading tool (see docs/BUILD_AND_SIDELOAD.md).

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: |
          swift --version
          command -v python3 || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)
      - name: Build & test BrainboxCore
        working-directory: Packages/BrainboxCore
        run: |
          STATUS=0
          swift test --parallel > core-test.log 2>&1 || STATUS=$?
          tail -n 60 core-test.log
          bash ../../scripts/ci/annotate-log.sh core-test.log "Core (Linux)"
          grep -E "Executed [0-9]+ tests?" core-test.log | tail -n 1 | sed 's/^/::notice title=Core test summary (Linux)::/' || true
          exit $STATUS

  gateway:
    name: Gateway tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: gateway
        run: pip install -q -e ".[test]"
      - name: Test
        working-directory: gateway
        run: |
          STATUS=0
          python -m pytest -q > gateway-test.log 2>&1 || STATUS=$?
          tail -n 40 gateway-test.log
          bash ../scripts/ci/annotate-log.sh gateway-test.log "Gateway"
          grep -E "[0-9]+ passed" gateway-test.log | tail -n 1 | sed 's/^/::notice title=Gateway test summary::/' || true
          exit $STATUS

  ios:
    name: iOS build, tests & unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ') · $(sw_vers -productVersion)"
          xcodebuild -version
          swift --version
          sw_vers

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start a real Brainbox gateway (echo adapter) for interop tests
        run: |
          python -m venv "$RUNNER_TEMP/gwvenv"
          "$RUNNER_TEMP/gwvenv/bin/pip" install -q ./gateway
          TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
          HASH=$(printf '%s' "$TOKEN" | shasum -a 256 | cut -d' ' -f1)
          mkdir -p "$RUNNER_TEMP/bbroot" "$RUNNER_TEMP/bbdata"
          cat > "$RUNNER_TEMP/gw.toml" <<EOF
          [server]
          host = "127.0.0.1"
          port = 8765
          data_dir = "$RUNNER_TEMP/bbdata"
          [auth]
          token_sha256 = "$HASH"
          max_failures_per_minute = 20
          [agent]
          adapter = "echo"
          name = "Echo"
          [system]
          file_roots = [ { path = "$RUNNER_TEMP/bbroot" } ]
          [terminal]
          enabled = true
          cwd = "$RUNNER_TEMP"
          EOF
          nohup "$RUNNER_TEMP/gwvenv/bin/brainbox-gateway" serve --config "$RUNNER_TEMP/gw.toml" > "$RUNNER_TEMP/gw.log" 2>&1 &
          for i in $(seq 1 20); do nc -z 127.0.0.1 8765 && break; sleep 0.5; done
          nc -z 127.0.0.1 8765 || { cat "$RUNNER_TEMP/gw.log"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "BRAINBOX_LIVE_GATEWAY_URL=ws://127.0.0.1:8765/v1/agent" >> "$GITHUB_ENV"
          echo "BRAINBOX_LIVE_GATEWAY_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "BRAINBOX_LIVE_FILE_ROOT=$RUNNER_TEMP/bbroot" >> "$GITHUB_ENV"

      - name: Core tests on macOS
        working-directory: Packages/BrainboxCore
        run: |
          STATUS=0
          swift test > core-test.log 2>&1 || STATUS=$?
          tail -n 60 core-test.log
          bash ../../scripts/ci/annotate-log.sh core-test.log "Core (macOS)"
          grep -E "Executed [0-9]+ tests?" core-test.log | tail -n 1 | sed 's/^/::notice title=Core test summary (macOS)::/' || true
          LIVE=$(grep -cE "LiveGatewayTests.*passed" core-test.log || true)
          LIVE_SKIP=$(grep -cE "LiveGatewayTests.*skipped" core-test.log || true)
          echo "::notice title=Live gateway interop::$LIVE passed, $LIVE_SKIP skipped (Swift client ↔ Python gateway)"
          exit $STATUS

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(bash scripts/ci/select-simulator.sh)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build & run unit + UI tests
        run: |
          mkdir -p build
          STATUS=0
          xcodebuild test \
            -project BrainboxAgent.xcodeproj \
            -scheme BrainboxAgent \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild-test.log 2>&1 || STATUS=$?
          grep -E "error:|Test Suite .*(passed|failed)|Test Case .*failed|Executed [0-9]+ test|\*\* TEST" build/xcodebuild-test.log || true
          if [ "$STATUS" -ne 0 ]; then tail -n 120 build/xcodebuild-test.log; fi
          bash scripts/ci/annotate-log.sh build/xcodebuild-test.log "iOS tests"
          grep -E "Executed [0-9]+ tests?" build/xcodebuild-test.log | tail -n 4 | sed 's/^/::notice title=iOS test summary::/' || true
          grep -E "Test Case .* skipped|Test skipped" build/xcodebuild-test.log | head -n 5 | sed 's/^/::notice title=Skipped::/' || true
          exit $STATUS

      - name: Archive (unsigned, device)
        run: |
          STATUS=0
          xcodebuild archive \
            -project BrainboxAgent.xcodeproj \
            -scheme BrainboxAgent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BrainboxAgent.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/archive.log 2>&1 || STATUS=$?
          tail -n 40 build/archive.log
          bash scripts/ci/annotate-log.sh build/archive.log "Archive"
          exit $STATUS

      - name: Package unsigned IPA
        run: bash scripts/package-unsigned-ipa.sh build/BrainboxAgent.xcarchive build/BrainboxAgent-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BrainboxAgent-unsigned-ipa
          path: build/BrainboxAgent-unsigned.ipa
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/xcodebuild-test.log
          retention-days: 7
