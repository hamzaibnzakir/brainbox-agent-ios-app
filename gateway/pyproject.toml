[project]
name = "brainbox-gateway"
version = "0.1.0"
description = "Brainbox Agent Protocol v1 gateway: bridges the Brainbox iOS app to Hermes (and other agents) on a private network."
requires-python = ">=3.10"
dependencies = [
  "websockets>=12,<16",
  "psutil>=5.9",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
brainbox-gateway = "brainbox_gateway.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brainbox_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
